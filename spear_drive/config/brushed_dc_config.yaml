# SPEAR brushed-DC EtherCAT slave configuration.
#
# This matches motor-controller-brushed-dc main at commit
# 1702cbe7d81f34de155ea2573bf81ba8727dde9d. Do not replace this with the
# arm/steering stepper configuration: the identity values currently collide,
# but the PDO layouts are different.
vendor_id: 0x00001337
product_id: 0x000004d2

sdo:
  # Firmware modes: 0=current, 1=velocity, 2=position. Position is unfinished.
  - {index: 0x8000, sub_index: 1, type: uint32, value: 0}
  # Firmware's current limit is in mA. This is its current default; confirm the
  # electrical limit before increasing any ROS current profile.
  - {index: 0x8000, sub_index: 2, type: uint32, value: 3000}

rpdo:
  - index: 0x1600
    channels:
      # Both standby (bit 1) and enable (bit 2) are required: enabled == 6.
      # The drive controller owns this interface and writes zero when inactive.
      - {index: 0x7000, sub_index: 1, type: uint32, command_interface: control_word, default: 0}
      # ROS current is amperes; embedded target current is milliamperes.
      - {index: 0x7000, sub_index: 2, type: int32, command_interface: current, factor: 1000.0, default: 0}
      # Unused in current mode, but required to reproduce the fixed firmware PDO.
      - {index: 0x7000, sub_index: 3, type: int32, default: 0}
      - {index: 0x7000, sub_index: 4, type: int32, default: 0}

tpdo:
  - index: 0x1A00
    channels:
      - {index: 0x6000, sub_index: 1, type: uint32, state_interface: status_word}
      # Embedded current is mA; expose amperes to ROS.
      - {index: 0x6000, sub_index: 2, type: int32, state_interface: current, factor: 0.001}
      # Keep encoder values raw so counts/revolution remains a runtime parameter.
      - {index: 0x6000, sub_index: 3, type: int32, state_interface: encoder_counts_per_second}
      - {index: 0x6000, sub_index: 4, type: int32, state_interface: encoder_counts}
      - {index: 0x6000, sub_index: 5, type: uint32, state_interface: duty_cycle}

sm:
  - {index: 0, type: output, pdo: ~,    watchdog: disable}
  - {index: 1, type: input,  pdo: ~,    watchdog: disable}
  - {index: 2, type: output, pdo: rpdo, watchdog: enable}
  - {index: 3, type: input,  pdo: tpdo, watchdog: disable}

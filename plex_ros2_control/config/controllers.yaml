controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    jsb:
      type: joint_state_broadcaster/JointStateBroadcaster

    jsb_gripper:
      type: joint_state_broadcaster/JointStateBroadcaster

    jsb_drive:
      type: joint_state_broadcaster/JointStateBroadcaster

    jsb_steer:
      type: joint_state_broadcaster/JointStateBroadcaster

    # arm
    velocity_controller:
      type: velocity_controllers/JointGroupVelocityController
        
    # steer
    steer_position_controller:
      type: position_controllers/JointGroupPositionController

    steer_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    # drive
    drive_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController
    
    # gripper
    gripper_current_controller:
      type: forward_command_controller/ForwardCommandController






jsb:
  ros__parameters:
    use_local_topics: false
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    interfaces:
      - position
      - velocity


jsb_gripper:
  ros__parameters:
    use_local_topics: true
    joints:
      - joint_7
    interfaces:
      - position

jsb_drive:
  ros__parameters:
    use_local_topics: true
    joints:
      - drive_fl
      - drive_fr
      - drive_ml
      - drive_mr
      - drive_bl
      - drive_br
    interfaces:
      - position
      - velocity

jsb_steer:
  ros__parameters:
    use_local_topics: true
    joints:
      - steer_fl
      - steer_fr
      # - steer_bl
      - steer_br
    interfaces:
      - position
      - velocity


velocity_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    action_monitor_rate: 1000.0


drive_velocity_controller:
  ros__parameters:
    joints:
      - drive_fl
      - drive_fr
      - drive_ml
      - drive_mr
      - drive_bl
      - drive_br
    action_monitor_rate: 1000.0


steer_position_controller:
  ros__parameters:
    joints:
      - steer_fl
      - steer_fr
      - steer_br

steer_velocity_controller:
  ros__parameters:
    joints:
      - steer_bl

gripper_current_controller:
  ros__parameters:
    joints:
      - joint_7
    interface_name: current

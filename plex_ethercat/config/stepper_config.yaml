# Configuration file for ZERO ERR drive
vendor_id: 0x00001337
product_id: 0x000004d2
auto_fault_reset: true 

# sdo:
#   - {index: 0x8000, sub_index: 1, type: uint8,   value: 1}          # Mode of operation
#   - {index: 0x8000, sub_index: 2, type: uint32,  value: 100000}     # Velocity maximum
#   - {index: 0x8000, sub_index: 3, type: int32,   value: 0}  # Position maximum (int32 max)
#   - {index: 0x8000, sub_index: 4, type: int32,   value: 0} # Position minimum (int32 min)
#   - {index: 0x8000, sub_index: 5, type: uint32,  value: 50}          # Position error tolerance
#   - {index: 0x8000, sub_index: 6, type: uint32,  value: 200000}      # Encoder resolution
#   - {index: 0x8001, sub_index: 1, type: int32, value: 0}         # Gain p
#   - {index: 0x8001, sub_index: 2, type: int32, value: 5}         # Gain i
#   - {index: 0x8001, sub_index: 3, type: int32, value: 5}         # Gain d
#   - {index: 0x8001, sub_index: 4, type: int32, value: 2000000}         # Max integral
#   - {index: 0x8001, sub_index: 5, type: int32, value: 60000}         # Max output

rpdo:  # TxPDO = transmit PDO Mapping
  - index: 0x1600
    channels:
      - {index: 0x7000, sub_index: 1, type: uint32, command_interface: control_word,                   default: 3}
      - {index: 0x7000, sub_index: 2, type: int32,  command_interface: position,     factor: 31831.0, default: 0}
      - {index: 0x7000, sub_index: 3, type: int32,  command_interface: velocity,     factor: 31831.0, default: 0}

tpdo:  # RxPDO = receive PDO Mapping
  - index: 0x1A00
    channels:
      - {index: 0x6000, sub_index: 1, type: uint32, state_interface: status_word,                      default: 0}
      - {index: 0x6000, sub_index: 2, type: int32,  state_interface: position,       factor: 0.0000314159153, default: 0}
      - {index: 0x6000, sub_index: 3, type: int32,  state_interface: velocity,       factor: 0.0000314159153, default: 0}

sm:  # Sync Manager
  - {index: 0, type: output, pdo: ~,    watchdog: disable}
  - {index: 1, type: input,  pdo: ~,    watchdog: disable}
  - {index: 2, type: output, pdo: rpdo, watchdog: enable}
  - {index: 3, type: input,  pdo: tpdo, watchdog: disable}
